<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tic-Tac-Toe</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --line: #334155;
      --x: #38bdf8;
      --o: #fb7185;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #34d399;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 50% -10%, #1e293b, var(--bg));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      letter-spacing: 0.5px;
    }
    h1 span.x { color: var(--x); }
    h1 span.o { color: var(--o); }

    .status {
      font-size: 1.1rem;
      color: var(--muted);
      min-height: 1.4em;
      text-align: center;
      font-weight: 600;
    }

    .scoreboard {
      display: flex;
      gap: 12px;
    }
    .score {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 18px;
      text-align: center;
      min-width: 78px;
    }
    .score .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .score .value { font-size: 1.5rem; font-weight: 700; margin-top: 2px; }
    .score.you .value { color: var(--x); }
    .score.cpu .value { color: var(--o); }
    .score.tie .value { color: var(--muted); }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: min(90vw, 360px);
      aspect-ratio: 1 / 1;
    }

    .cell {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.4rem, 14vw, 4rem);
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s ease, background 0.15s ease;
    }
    .cell:active { transform: scale(0.96); }
    .cell.x { color: var(--x); }
    .cell.o { color: var(--o); }
    .cell.win { background: #064e3b; border-color: var(--accent); }
    .cell.disabled { cursor: default; }

    button.reset {
      background: var(--accent);
      color: #052e22;
      border: none;
      border-radius: 12px;
      padding: 12px 26px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease;
    }
    button.reset:active { transform: scale(0.96); }
    button.reset:hover { filter: brightness(1.05); }

    .footer { color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1><span class="x">Tic</span>-Tac-<span class="o">Toe</span></h1>
  <div class="status" id="status">Your turn — you're X</div>

  <div class="scoreboard">
    <div class="score you"><div class="label">You</div><div class="value" id="scoreYou">0</div></div>
    <div class="score tie"><div class="label">Tie</div><div class="value" id="scoreTie">0</div></div>
    <div class="score cpu"><div class="label">CPU</div><div class="value" id="scoreCpu">0</div></div>
  </div>

  <div class="board" id="board"></div>

  <button class="reset" id="reset">New Game</button>
  <div class="footer">You are X · Computer is O</div>

  <script>
    const HUMAN = 'X';
    const CPU = 'O';
    const WIN_LINES = [
      [0,1,2],[3,4,5],[6,7,8], // rows
      [0,3,6],[1,4,7],[2,5,8], // cols
      [0,4,8],[2,4,6]          // diagonals
    ];

    let board = Array(9).fill('');
    let gameOver = false;
    const scores = { you: 0, tie: 0, cpu: 0 };

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset');

    // Build the 9 cells
    const cells = [];
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      cell.addEventListener('click', () => handleClick(i));
      boardEl.appendChild(cell);
      cells.push(cell);
    }

    function handleClick(i) {
      if (gameOver || board[i] !== '') return;
      makeMove(i, HUMAN);
      const result = evaluate(board);
      if (result) return endGame(result);
      statusEl.textContent = 'Computer is thinking…';
      setTimeout(cpuMove, 350);
    }

    function makeMove(i, player) {
      board[i] = player;
      cells[i].textContent = player;
      cells[i].classList.add(player.toLowerCase(), 'disabled');
    }

    function cpuMove() {
      const best = bestMove(board);
      if (best === -1) return;
      makeMove(best, CPU);
      const result = evaluate(board);
      if (result) return endGame(result);
      statusEl.textContent = "Your turn — you're X";
    }

    // Returns { winner: 'X'|'O', line } , 'tie', or null
    function evaluate(b) {
      for (const line of WIN_LINES) {
        const [a, c, d] = line;
        if (b[a] && b[a] === b[c] && b[a] === b[d]) {
          return { winner: b[a], line };
        }
      }
      if (b.every(v => v !== '')) return 'tie';
      return null;
    }

    function endGame(result) {
      gameOver = true;
      cells.forEach(c => c.classList.add('disabled'));
      if (result === 'tie') {
        scores.tie++;
        statusEl.textContent = "It's a tie! 🤝";
      } else {
        result.line.forEach(i => cells[i].classList.add('win'));
        if (result.winner === HUMAN) {
          scores.you++;
          statusEl.textContent = 'You win! 🎉';
        } else {
          scores.cpu++;
          statusEl.textContent = 'Computer wins! 🤖';
        }
      }
      updateScores();
    }

    function updateScores() {
      document.getElementById('scoreYou').textContent = scores.you;
      document.getElementById('scoreTie').textContent = scores.tie;
      document.getElementById('scoreCpu').textContent = scores.cpu;
    }

    // Minimax — makes the computer unbeatable
    function bestMove(b) {
      let bestScore = -Infinity;
      let move = -1;
      for (let i = 0; i < 9; i++) {
        if (b[i] === '') {
          b[i] = CPU;
          const score = minimax(b, 0, false);
          b[i] = '';
          if (score > bestScore) { bestScore = score; move = i; }
        }
      }
      return move;
    }

    function minimax(b, depth, isMaximizing) {
      const result = evaluate(b);
      if (result === 'tie') return 0;
      if (result) return result.winner === CPU ? 10 - depth : depth - 10;

      if (isMaximizing) {
        let best = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (b[i] === '') {
            b[i] = CPU;
            best = Math.max(best, minimax(b, depth + 1, false));
            b[i] = '';
          }
        }
        return best;
      } else {
        let best = Infinity;
        for (let i = 0; i < 9; i++) {
          if (b[i] === '') {
            b[i] = HUMAN;
            best = Math.min(best, minimax(b, depth + 1, true));
            b[i] = '';
          }
        }
        return best;
      }
    }

    function newGame() {
      board = Array(9).fill('');
      gameOver = false;
      cells.forEach(c => {
        c.textContent = '';
        c.className = 'cell';
      });
      statusEl.textContent = "Your turn — you're X";
    }

    resetBtn.addEventListener('click', newGame);
  </script>
</body>
</html>
